<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCQ Results — Mah'a Gnan Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <img src="assets/logo.png" alt="" />
    <span>Mah'a <em>Gnan</em> Admin</span>
  </div>
  <div class="flex gap-16" style="align-items:center;">
    <a href="admin-dashboard.html">Question Bank</a>
    <a href="admin-submissions.html">Submissions &amp; Grading</a>
    <a href="admin-mcq.html">MCQ Questions</a>
    <a href="admin-mcq-results.html"><strong>MCQ Results</strong></a>
    <button class="btn btn-outline btn-sm" id="logoutBtn">Log Out</button>
  </div>
</div>

<div class="container">
  <h2>MCQ Test Results</h2>
  <p class="small-note">Auto-graded instantly on submission — no manual marking needed. Review proctoring snapshots here if a score looks suspicious.</p>

  <div class="card mt-24" style="padding:0; overflow:hidden;">
    <div style="padding:16px;">
      <input type="text" id="searchBox" placeholder="Search by student name or email..." />
    </div>
    <table>
      <thead>
        <tr><th>Student</th><th>Score</th><th>Status</th><th>Warnings</th><th>Snapshots</th><th></th></tr>
      </thead>
      <tbody id="subTableBody"></tbody>
    </table>
  </div>

  <div id="detailPanel" class="mt-24 hidden"></div>
</div>

<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { isAdmin, logoutUser } from "./js/auth.js";
  import { getAllMcqSubmissions, deleteMcqSubmission, clearMcqViolationImages } from "./js/mcq.js";
  import { getAllMcqQuestions } from "./js/mcq.js";

  let submissions = [];
  let questions = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user || !(await isAdmin(user.uid))) {
      window.location.href = "admin-login.html";
      return;
    }
    questions = await getAllMcqQuestions();
    await loadSubmissions();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await logoutUser();
    window.location.href = "admin-login.html";
  });

  document.getElementById("searchBox").addEventListener("input", (e) => {
    renderTable(filterSubs(e.target.value));
  });

  function filterSubs(term) {
    const t = term.trim().toLowerCase();
    if (!t) return submissions;
    return submissions.filter(s =>
      (s.studentName || "").toLowerCase().includes(t) ||
      (s.studentEmail || "").toLowerCase().includes(t)
    );
  }

  async function loadSubmissions() {
    submissions = await getAllMcqSubmissions();
    renderTable(submissions);
  }

  function renderTable(list) {
    const body = document.getElementById("subTableBody");
    body.innerHTML = "";
    list.forEach(sub => {
      const row = document.createElement("tr");
      const statusBadge = sub.status === "submitted" ? "badge-green" : sub.status === "auto-submitted" ? "badge-red" : "badge-amber";
      row.innerHTML = `
        <td><strong>${sub.studentName || "—"}</strong><br/><span class="small-note">${sub.studentEmail || ""}</span></td>
        <td><span class="badge badge-black">${sub.score ?? 0} / ${sub.totalQuestions ?? 0}</span></td>
        <td><span class="badge ${statusBadge}">${sub.status}</span></td>
        <td>${sub.violationCount || 0} / 3</td>
        <td>${(sub.violationImages || []).length}</td>
        <td><button class="btn btn-outline btn-sm viewBtn">Review</button></td>
      `;
      row.querySelector(".viewBtn").addEventListener("click", () => showDetail(sub));
      body.appendChild(row);
    });
  }

  function showDetail(sub) {
    const panel = document.getElementById("detailPanel");
    panel.classList.remove("hidden");

    const answersHtml = questions.map((q, idx) => {
      const selected = sub.answers ? sub.answers[q.id] : undefined;
      const isCorrect = selected === q.correctIndex;
      return `
        <div class="card mt-16">
          <div class="flex-between">
            <span class="badge badge-green">Q${idx + 1}</span>
            <span class="badge ${selected === undefined ? "badge-amber" : isCorrect ? "badge-green" : "badge-red"}">
              ${selected === undefined ? "Not answered" : isCorrect ? "Correct" : "Incorrect"}
            </span>
          </div>
          <p style="color:var(--ink); font-weight:600; margin-top:10px;">${q.text}</p>
          <div class="mt-16">
            ${q.options.map((opt, i) => {
              let style = "color:var(--gray-text);";
              let mark = "";
              if (i === q.correctIndex) { style = "background:var(--green-pale); color:var(--green-deep); font-weight:600;"; mark = "&#10003; "; }
              if (i === selected && i !== q.correctIndex) { style = "background:var(--red-pale); color:var(--red-alert); font-weight:600;"; mark = "&#10007; "; }
              return `<div style="padding:6px 10px; border-radius:6px; margin-bottom:4px; ${style}">${mark}${opt}</div>`;
            }).join("")}
          </div>
        </div>
      `;
    }).join("");

    const imagesHtml = (sub.violationImages || []).map(url => `
      <img src="${url}" style="width:110px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--gray-line);" />
    `).join("");

    panel.innerHTML = `
      <div class="circuit-divider"><span class="node"></span></div>
      <div class="flex-between">
        <h3>${sub.studentName} — MCQ Review</h3>
        <button class="btn btn-danger btn-sm" id="deleteSubBtn">Delete This Submission</button>
      </div>
      <div class="badge badge-black" style="font-size:0.85rem; padding:6px 14px;">Score: ${sub.score ?? 0} / ${sub.totalQuestions ?? 0}</div>
      ${answersHtml}

      <div class="card mt-24">
        <div class="flex-between">
          <h3>Proctoring Snapshots (${(sub.violationImages || []).length})</h3>
          <button class="btn btn-danger btn-sm" id="clearImagesBtn">Delete All Snapshots</button>
        </div>
        <div class="flex gap-8 mt-16" style="flex-wrap:wrap;">
          ${imagesHtml || '<p class="small-note">No snapshots recorded.</p>'}
        </div>
      </div>
    `;

    panel.querySelector("#deleteSubBtn").addEventListener("click", async () => {
      if (confirm(`Permanently delete ${sub.studentName}'s MCQ submission?`)) {
        await deleteMcqSubmission(sub.id);
        panel.classList.add("hidden");
        loadSubmissions();
      }
    });

    panel.querySelector("#clearImagesBtn").addEventListener("click", async () => {
      if (confirm("Delete all snapshot references for this student?")) {
        await clearMcqViolationImages(sub.id);
        sub.violationImages = [];
        showDetail(sub);
        loadSubmissions();
      }
    });
  }
</script>

</body>
</html>
