<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Login — Mah'a Gnan</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-center">
  <div class="card card-auth">
    <div class="brand-header">
      <img src="assets/logo.png" alt="Mah'a Gnan" />
      <h1>Student Login</h1>
      <div class="tagline">Learn &bull; Grow &bull; Innovate</div>
    </div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" />

      <div class="error-text" id="errorMsg"></div>

      <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
    </form>

    <div class="form-footer">
      New here? <a href="student-signup.html">Create an account</a>
    </div>
  </div>
</div>

<script type="module">
  import { loginUser } from "./js/auth.js";

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");
  const loginBtn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await loginUser(email, password);
      // Face verification happens next, right before the exam starts.
      window.location.href = "face-verify.html";
    } catch (err) {
      errorMsg.textContent = "Login failed. Check your email and password.";
      loginBtn.disabled = false;
      loginBtn.textContent = "Log In";
    }
  });
</script>

</body>
</html>
